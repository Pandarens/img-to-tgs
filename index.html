<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panda Stickers — GIF / Video → Telegram TGS & WEBM</title>
<meta name="description" content="Convert GIF and video to Telegram stickers (TGS / WEBM) right in your browser.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#7c5cff">
<style>
  :root {
    --bg:#0c0b12; --bg2:#14121d; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
    --fg:#f2f0f7; --mut:#9a96a8; --pink:#ff3d9a; --vio:#7c5cff; --grad:linear-gradient(135deg,var(--pink),var(--vio));
    --ok:#3ddc97; --bad:#ff6b81; --shadow:0 10px 40px -12px rgba(0,0,0,.6); color-scheme:dark;
  }
  :root[data-theme=light] {
    --bg:#f6f4fb; --bg2:#ffffff; --card:rgba(255,255,255,.85); --line:rgba(20,10,40,.09);
    --fg:#1b1726; --mut:#6d6880; --shadow:0 10px 40px -16px rgba(60,30,120,.25); color-scheme:light;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; font:15px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--fg); background:var(--bg); min-height:100vh; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background: radial-gradient(600px 400px at 10% -5%, rgba(255,61,154,.22), transparent 70%),
                radial-gradient(700px 500px at 100% 0%, rgba(124,92,255,.22), transparent 70%); }
  main { max-width:1160px; margin:0 auto; padding:22px 20px 40px; }
  a { color:var(--pink); }

  /* header */
  header { display:flex; align-items:center; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
  header img { width:46px; height:46px; border-radius:14px; box-shadow:0 6px 24px -6px rgba(255,61,154,.6); }
  header h1 { font-size:22px; line-height:1.2; margin:0; letter-spacing:-.01em; }
  header h1 em { font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p { margin:2px 0 0; color:var(--mut); font-size:13.5px; }
  .tools { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .seg { display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:3px; }
  .seg button { background:none; border:0; color:var(--mut); padding:6px 11px; border-radius:9px; font:600 13px inherit; font-family:inherit; cursor:pointer; }
  .seg button.on { background:var(--grad); color:#fff; }
  .icon-btn { width:38px; height:38px; display:grid; place-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; color:var(--fg); cursor:pointer; font-size:17px; }

  /* layout */
  .layout { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); gap:20px; align-items:start; }
  @media (max-width:880px) { .layout { grid-template-columns:1fr; } }
  .stick { position:sticky; top:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:18px; box-shadow:var(--shadow); backdrop-filter:blur(14px); }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); margin:0 0 12px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .step { width:20px; height:20px; border-radius:50%; background:var(--grad); color:#fff; display:inline-grid; place-items:center; font-size:11px; letter-spacing:0; }

  /* drop zone */
  #drop { position:relative; border-radius:16px; padding:34px 18px; text-align:center; cursor:pointer; transition:.2s;
    background: linear-gradient(var(--bg2),var(--bg2)) padding-box, var(--grad) border-box; border:2px dashed transparent; }
  #drop:hover, #drop.over { transform:translateY(-2px); box-shadow:0 14px 40px -14px rgba(255,61,154,.55); }
  #drop.over { background: linear-gradient(rgba(124,92,255,.12),rgba(255,61,154,.12)) padding-box, var(--grad) border-box; }
  #drop .big { font-size:42px; line-height:1; margin-bottom:10px; }
  #drop .t1 { font-weight:650; font-size:16px; }
  #drop .t2 { color:var(--mut); font-size:13px; margin-top:4px; }
  kbd { font:600 11.5px ui-monospace,monospace; padding:2px 6px; border-radius:6px; border:1px solid var(--line); background:var(--card); }

  /* format tiles */
  .fmt { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .fmt label { position:relative; display:block; cursor:pointer; padding:14px; border-radius:14px; border:1.5px solid var(--line); background:var(--bg2); transition:.15s; }
  .fmt label:hover { border-color:rgba(255,61,154,.5); }
  .fmt input { position:absolute; opacity:0; }
  .fmt label:has(input:checked) { border-color:transparent; background: linear-gradient(var(--bg2),var(--bg2)) padding-box, var(--grad) border-box; box-shadow:0 8px 26px -12px rgba(124,92,255,.7); }
  .fmt b { display:block; font-size:16px; }
  .fmt small { color:var(--mut); font-size:12.5px; line-height:1.35; display:block; margin-top:2px; }
  .fmt .badge { position:absolute; top:12px; right:12px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--mut); }

  /* presets + sliders */
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 4px; }
  .chip { border:1px solid var(--line); background:var(--bg2); color:var(--fg); padding:7px 13px; border-radius:999px; font:600 13px inherit; font-family:inherit; cursor:pointer; }
  .chip.on { background:var(--grad); color:#fff; border-color:transparent; }
  details { margin-top:10px; }
  summary { cursor:pointer; color:var(--mut); font-size:13.5px; font-weight:600; list-style:none; padding:6px 0; }
  summary::before { content:"▸ "; } details[open] summary::before { content:"▾ "; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px 18px; margin-top:8px; }
  .grid label, .opt label { display:block; font-size:13px; color:var(--mut); }
  .grid label b { color:var(--fg); }
  input[type=range] { width:100%; accent-color:var(--pink); margin-top:6px; }
  .opt { display:flex; gap:16px; flex-wrap:wrap; margin-top:14px; }
  .opt label { display:flex; gap:8px; align-items:center; color:var(--fg); font-weight:550; cursor:pointer; }
  input[type=checkbox] { accent-color:var(--pink); width:16px; height:16px; }
  .dur { margin-top:14px; }

  /* buttons */
  .actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:16px; }
  .btn { border:0; border-radius:12px; padding:11px 18px; font:650 14.5px inherit; font-family:inherit; cursor:pointer; color:#fff; background:var(--grad); transition:.15s; display:inline-flex; gap:8px; align-items:center; }
  .btn:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 10px 26px -10px rgba(255,61,154,.8); }
  .btn.ghost { background:var(--bg2); color:var(--fg); border:1px solid var(--line); }
  .btn:disabled { opacity:.45; cursor:default; }

  /* status + progress */
  #status { color:var(--mut); font-size:13.5px; min-height:1.4em; margin-top:12px; }
  .bar { height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:8px; opacity:0; transition:opacity .2s; }
  .bar.on { opacity:1; }
  .bar i { display:block; height:100%; width:0; background:var(--grad); border-radius:99px; transition:width .2s; }

  /* preview */
  .previews { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .pv span.lbl { display:block; font-size:12px; color:var(--mut); font-weight:650; text-transform:uppercase; letter-spacing:.07em; margin-bottom:6px; }
  .pv > div { width:100%; aspect-ratio:1; border-radius:14px; overflow:hidden; border:1px solid var(--line); display:grid; place-items:center; color:var(--mut); font-size:13px; text-align:center;
    background: repeating-conic-gradient(rgba(128,128,128,.14) 0 25%, transparent 0 50%) 0 0/18px 18px; }
  .pv > div > * { width:100%; height:100%; object-fit:contain; }
  .pv > div > span { width:auto; height:auto; padding:10px; }
  .tgwrap:has(#tgout:empty) { display:none; }
  .tgwrap { margin-top:14px; display:flex; justify-content:center; padding:18px; border-radius:16px; background:linear-gradient(160deg,#6ba0c9,#8dbf8a); }
  :root[data-theme=light] .tgwrap { background:linear-gradient(160deg,#a7cdee,#c5e3b4); }
  .tgwrap > div { width:180px; height:180px; }
  .tgwrap > div > * { width:100%; height:100%; object-fit:contain; }
  .result-meta { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .pill { font-size:12.5px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--bg2); border:1px solid var(--line); }
  .pill.ok { color:var(--ok); border-color:rgba(61,220,151,.4); } .pill.bad { color:var(--bad); border-color:rgba(255,107,129,.4); }

  /* queue */
  .qhead { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  #queue { display:flex; flex-direction:column; gap:6px; max-height:360px; overflow:auto; }
  .qi { display:flex; gap:10px; align-items:center; padding:7px; border-radius:12px; cursor:pointer; border:1px solid transparent; }
  .qi:hover { background:var(--bg2); }
  .qi.sel { background:var(--bg2); border-color:rgba(255,61,154,.45); }
  .qi .th { width:40px; height:40px; border-radius:9px; flex:none; overflow:hidden; background:repeating-conic-gradient(rgba(128,128,128,.14) 0 25%, transparent 0 50%) 0 0/10px 10px; }
  .qi .th > * { width:100%; height:100%; object-fit:cover; }
  .qi .meta { flex:1; min-width:0; }
  .qi .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; font-size:14px; }
  .qi .s { color:var(--mut); font-size:12.5px; }
  .qi button { flex:none; width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  .qi button:hover { border-color:var(--pink); }
  .spin { display:inline-block; width:10px; height:10px; border:2px solid var(--pink); border-right-color:transparent; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-1px; margin-right:4px; }
  @keyframes sp { to { transform:rotate(360deg); } }

  /* how-to */
  .how ol { margin:0; padding-left:20px; color:var(--mut); font-size:14px; }
  .how li { margin:4px 0; } .how li b { color:var(--fg); }
  .note { color:var(--mut); font-size:12.5px; margin-top:10px; }
  footer { text-align:center; color:var(--mut); font-size:12.5px; margin-top:10px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }

  /* editor */
  dialog#ed { border:1px solid var(--line); border-radius:22px; padding:0; background:var(--bg2); color:var(--fg); box-shadow:0 30px 80px -20px rgba(0,0,0,.7); width:min(520px, calc(100vw - 24px)); }
  dialog#ed::backdrop { background:rgba(8,6,16,.6); backdrop-filter:blur(4px); }
  .ed-in { padding:18px; }
  .ed-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
  .ed-head b { font-size:17px; } .ed-head small { color:var(--mut); display:block; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:340px; }
  #edStage { position:relative; width:min(100%, calc(100vh - 330px)); margin:0 auto; aspect-ratio:1; border-radius:14px; overflow:hidden; touch-action:none; user-select:none;
    background: repeating-conic-gradient(rgba(128,128,128,.16) 0 25%, transparent 0 50%) 0 0/18px 18px; }
  #edStage > img, #edStage > video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none; }
  #edBox { position:absolute; border:2px solid #fff; border-radius:6px; box-shadow:0 0 0 9999px rgba(10,6,20,.55); cursor:move; display:none; }
  #edBox::before, #edBox::after { content:""; position:absolute; inset:33.3% 0; border-top:1px solid rgba(255,255,255,.45); border-bottom:1px solid rgba(255,255,255,.45); pointer-events:none; }
  #edBox::after { inset:0 33.3%; border:0; border-left:1px solid rgba(255,255,255,.45); border-right:1px solid rgba(255,255,255,.45); }
  #edFrame { position:absolute; inset:0; border:2px dashed rgba(255,61,154,.8); border-radius:14px; pointer-events:none; display:none; }
  .ed-row { margin-top:14px; }
  .ed-row label { display:block; font-size:13px; color:var(--mut); } .ed-row label b { color:var(--fg); }
  .ed-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }
  .ed-actions .btn.ghost:first-child { margin-right:auto; }
  .seg.wide { display:flex; } .seg.wide button { flex:1; }
  .qi .tag { font-size:11px; padding:1px 6px; border-radius:6px; background:var(--grad); color:#fff; margin-left:6px; vertical-align:1px; }

  /* toast */
  #toast { position:fixed; left:50%; bottom:22px; transform:translate(-50%,30px); opacity:0; background:var(--bg2); border:1px solid var(--line); color:var(--fg);
    padding:10px 16px; border-radius:12px; box-shadow:var(--shadow); font-size:14px; transition:.25s; pointer-events:none; z-index:10; }
  #toast.on { opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
<main>
  <header>
    <img src="favicon.svg" alt="">
    <div>
      <h1><em>Panda</em> Stickers</h1>
      <p><span data-i="sub"></span></p>
    </div>
    <div class="tools">
      <div class="seg" id="lang"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
      <button class="icon-btn" id="theme" title="Theme">🌙</button>
    </div>
  </header>

  <div class="layout">
    <div>
      <section class="card">
        <h2><span class="step">1</span><span data-i="s1"></span></h2>
        <div id="drop">
          <div class="big">🐼</div>
          <div class="t1"><span data-i="drop"></span></div>
          <div class="t2"><span data-i="drop2"></span> · <kbd>Ctrl</kbd>+<kbd>V</kbd></div>
          <input id="file" type="file" multiple accept="image/gif,video/*,image/webp,image/png" hidden>
        </div>
      </section>

      <section class="card">
        <h2><span class="step">2</span><span data-i="s2"></span></h2>
        <div class="fmt">
          <label><input type="radio" name="fmt" value="tgs" checked><span class="badge">≤ 64 KB</span><b>TGS</b><small data-i="tgs"></small></label>
          <label><input type="radio" name="fmt" value="webm"><span class="badge">≤ 256 KB</span><b>WEBM</b><small data-i="webm"></small></label>
        </div>

        <div class="chips t" id="presets">
          <button class="chip" data-p="max"><span data-i="pMax"></span></button>
          <button class="chip" data-p="bal"><span data-i="pBal"></span></button>
          <button class="chip" data-p="min"><span data-i="pMin"></span></button>
        </div>

        <label class="dur" style="display:block;font-size:13px;color:var(--mut)"><span data-i="dur"></span>: <b id="v-dur" style="color:var(--fg)"></b> <span data-i="sec"></span><input id="dur" type="range" min="0.5" max="3" step="0.1" value="3"></label>

        <details class="t">
          <summary><span data-i="adv"></span></summary>
          <div class="grid">
            <label><span data-i="res"></span>: <b id="v-res"></b> px<input id="res" type="range" min="48" max="320" step="8" value="192"></label>
            <label><span data-i="colors"></span>: <b id="v-colors"></b><input id="colors" type="range" min="2" max="32" value="12"></label>
            <label><span data-i="fps"></span>: <b id="v-fps"></b><input id="fps" type="range" min="5" max="30" value="15"></label>
            <label><span data-i="omit"></span>: <b id="v-omit"></b><input id="omit" type="range" min="0" max="40" value="4"></label>
            <label><span data-i="blur"></span>: <b id="v-blur"></b><input id="blur" type="range" min="0" max="5" value="0"></label>
          </div>
        </details>
        <div class="opt t">
          <label><input id="auto" type="checkbox" checked><span data-i="auto"></span></label>
          <label><input id="transp" type="checkbox"><span data-i="transp"></span></label>
        </div>

        <div class="actions">
          <button class="btn" id="go" disabled>⚡ <span data-i="go"></span></button>
        </div>
        <div id="status"></div>
        <div class="bar" id="bar"><i></i></div>
      </section>

      <section class="card" id="qcard" style="display:none">
        <div class="qhead">
          <h2 style="margin:0"><span data-i="files"></span> · <span id="qcount">0</span></h2>
          <div style="display:flex;gap:8px">
            <button class="btn ghost" id="clear">🗑 <span data-i="clear"></span></button>
            <button class="btn" id="zip" disabled>📦 <span data-i="zip"></span></button>
          </div>
        </div>
        <div id="queue"></div>
      </section>
    </div>

    <div class="stick">
      <section class="card">
        <h2><span class="step">3</span><span data-i="s3"></span></h2>
        <div class="previews">
          <div class="pv"><span class="lbl" data-i="src"></span><div id="src"><span data-i="empty"></span></div></div>
          <div class="pv"><span class="lbl" data-i="out"></span><div id="out"><span data-i="empty"></span></div></div>
        </div>
        <div class="tgwrap" title="Telegram"><div id="tgout"></div></div>
        <div class="result-meta">
          <span class="pill" id="pill" style="visibility:hidden"></span>
          <span style="display:flex;gap:8px"><button class="btn ghost" id="edBtn" disabled>✂️ <span data-i="edit"></span></button><button class="btn" id="dl" disabled>⬇ <span data-i="dl"></span></button></span>
        </div>
      </section>

      <section class="card how">
        <h2>✈️ <span data-i="howT"></span></h2>
        <ol>
          <li data-i="how1"></li>
          <li data-i="how2"></li>
          <li data-i="how3"></li>
        </ol>
        <div class="note" data-i="note"></div>
      </section>
    </div>
  </div>
  <footer><span data-i="foot"></span> · <a href="https://github.com/Pandarens/img-to-tgs" target="_blank" rel="noopener">GitHub</a></footer>
</main>
<dialog id="ed">
  <div class="ed-in">
    <div class="ed-head"><div><b>✂️ <span data-i="edTitle"></span></b><small id="edName"></small></div><button class="icon-btn" id="edX">✕</button></div>
    <div id="edStage"><div id="edFrame"></div><div id="edBox"></div></div>
    <div class="ed-row"><div class="seg wide" id="edMode">
      <button data-m="orig"><span data-i="mOrig"></span></button><button data-m="crop"><span data-i="mCrop"></span></button><button data-m="fit"><span data-i="mFit"></span></button>
    </div></div>
    <div class="ed-row" id="edZoomRow"><label><span data-i="zoom"></span>: <b id="edZoomV"></b><input id="edZoom" type="range" min="0.2" max="1" step="0.01"></label></div>
    <div class="ed-row"><label><span data-i="speed"></span>: <b id="edSpeedV"></b><input id="edSpeed" type="range" min="0.25" max="3" step="0.25"></label></div>
    <div class="ed-actions">
      <button class="btn ghost" id="edReset">↺ <span data-i="reset"></span></button>
      <button class="btn ghost" id="edCancel"><span data-i="cancel"></span></button>
      <button class="btn" id="edApply">✓ <span data-i="apply"></span></button>
    </div>
  </div>
</dialog>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie_light.min.js"></script>
<script type="module">
const $ = id => document.getElementById(id);
const I18N = {
  ru: {
    sub: 'GIF и видео → стикеры Telegram. Прямо в браузере, файлы никуда не загружаются.',
    s1: 'Загрузи файлы', s2: 'Формат и качество', s3: 'Результат',
    drop: 'Перетащи GIF / MP4 / WEBM или нажми, чтобы выбрать', drop2: 'можно сразу несколько',
    tgs: 'Векторный анимированный стикер, стилизованная картинка', webm: 'Видеостикер — выглядит точно как исходник, с прозрачностью',
    pMax: '💎 Максимум деталей', pBal: '⚖️ Баланс', pMin: '🪶 Лёгкий', adv: 'Тонкая настройка',
    res: 'Разрешение трассировки', colors: 'Цветов', fps: 'Кадров в секунду', dur: 'Длительность', sec: 'с', omit: 'Убрать мелкие детали', blur: 'Сглаживание',
    auto: 'Ужать до 64 КБ автоматически', transp: 'Убрать фон (цвет угла)', go: 'Конвертировать заново', dl: 'Скачать', src: 'Исходник', out: 'Стикер',
    empty: 'Здесь появится превью', clear: 'Очистить',
    howT: 'Как добавить в Telegram',
    how1: 'Открой бота <a href="https://t.me/Stickers" target="_blank" rel="noopener">@Stickers</a>',
    how2: 'Отправь <b>/newanimated</b> для TGS или <b>/newvideo</b> для WEBM',
    how3: 'Пришли эмодзи и скачанный файл — готово 🎉',
    note: 'TGS: 512×512, до 3 с, только векторы, ≤ 64 КБ — поэтому картинка упрощается. WEBM: VP9 с прозрачностью, 512 px, до 3 с, ≤ 256 КБ.',

async function toWebm(o) {
  if (!('VideoEncoder' in window)) throw new Error(T('noWC'));
  status(T('extract'));
  const fps = Math.min(30, Math.max(o.fps, 30)); // sample at 30 fps for smoothness
  const { frames, w: fw, h: fh } = await extractFrames(file, fps, o.dur, 512);
  const w = fw & ~1, h = fh & ~1;

  // so held GIF frames are repeated instead of stretched (repeats cost almost nothing in VP9)
  const list = [];
  for (const fr of frames) for (let r = 0; r < fr.n; r++) { list.push({ c: fr.c, tsMs: Math.round(t * 1000 / fps), us: Math.round(t * 1e6 / fps) }); t++; }

  const alphaCache = new Map();
  const alphaBufs = list.map(fr => { if (alphaCache.has(fr.c)) return alphaCache.get(fr.c);

    const buf = new Uint8Array(w * h * 3 / 2).fill(128);
    for (let i = 0; i < w * h; i++) buf[i] = d[i * 4 + 3];

      const i = list.indexOf(fr);

    });
    blob = muxWebm(w, h, durMs, list.map((fr, i) => ({ tsMs: fr.tsMs, key: col[i].key, data: col[i].data, alpha: alp[i].data })));

$('edBox').onpointerdown = e => { e.preventDefault(); $('edBox').setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, cx: ed.cx, cy: ed.cy }; };
$('edBox').onpointermove = e => {
  if (!drag) return;
  const L = edLayout(), r = cropRect(L.sw, L.sh, ed), half = r.side / 2;
  const nx = drag.cx + (e.clientX - drag.x) / L.k / L.sw, ny = drag.cy + (e.clientY - drag.y) / L.k / L.sh;
  ed.cx = Math.min(Math.max(nx, half / L.sw), 1 - half / L.sw);
  ed.cy = Math.min(Math.max(ny, half / L.sh), 1 - half / L.sh);
  edDraw();
};
$('edBox').onpointerup = $('edBox').onpointercancel = () => drag = null;
$('edStage').onwheel = e => { if (ed?.mode !== 'crop') return; e.preventDefault(); ed.zoom = Math.min(1, Math.max(.2, ed.zoom - e.deltaY * .001)); edDraw(); };
addEventListener('resize', () => { if ($('ed').open) edDraw(); });

$('clear').onclick = () => { if (busy) return; queue = []; sel = -1; select(-1); renderQueue(); };

// ---------- frame extraction -> array of {canvas, t} sampled at fps ----------
// edit = { mode: 'orig' | 'crop' | 'fit', cx, cy (crop centre 0..1), zoom (crop side / short side), speed }
const DEFAULT_EDIT = { mode: 'orig', cx: .5, cy: .5, zoom: 1, speed: 1 };
let edit = DEFAULT_EDIT; // edit settings of the file being converted
function cropRect(sw, sh, e) {
  const side = Math.min(sw, sh) * e.zoom;
  const sx = Math.min(Math.max(e.cx * sw - side / 2, 0), sw - side);
  const sy = Math.min(Math.max(e.cy * sh - side / 2, 0), sh - side);
  return { sx, sy, side };
}
function layout(sw, sh, size, e) {
  if (e.mode === 'crop') {
    const { sx, sy, side } = cropRect(sw, sh, e);
    return { w: size, h: size, draw: (ctx, src) => ctx.drawImage(src, sx, sy, side, side, 0, 0, size, size) };
  }
  const s = size / Math.max(sw, sh), dw = Math.max(1, Math.round(sw * s)), dh = Math.max(1, Math.round(sh * s));
  if (e.mode === 'fit') {
    return { w: size, h: size, draw: (ctx, src) => ctx.drawImage(src, (size - dw) / 2, (size - dh) / 2, dw, dh) };
  }
  return { w: dw, h: dh, draw: (ctx, src) => ctx.drawImage(src, 0, 0, dw, dh) };
}

async function extractFrames(f, fps, maxDur, size) {
  const out = [], sp = edit.speed || 1;
  const mk = (L, src) => { const c = document.createElement('canvas'); c.width = L.w; c.height = L.h; L.draw(c.getContext('2d', { willReadFrequently: true }), src); return c; };

  if (f.type.startsWith('video')) {
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.src = URL.createObjectURL(f);
    await new Promise((ok, err) => { v.onloadeddata = ok; v.onerror = () => err(new Error(T('badVideo'))); });
    const dur = Math.min((v.duration || maxDur * sp) / sp, maxDur);
    const L = layout(v.videoWidth, v.videoHeight, size, edit);
    const n = Math.max(1, Math.round(dur * fps));
    for (let i = 0; i < n; i++) {
      v.currentTime = Math.min(i / fps * sp, v.duration - 0.001);
      await new Promise(ok => v.onseeked = ok);
      out.push({ c: mk(L, v), n: 1 });
    }
    return { frames: out, w: L.w, h: L.h, dur: n / fps };
  }

  if (!('ImageDecoder' in window)) throw new Error(T('noID'));
  const dec = new ImageDecoder({ data: await f.arrayBuffer(), type: f.type || 'image/gif' });
  await dec.tracks.ready;
  const count = dec.tracks.selectedTrack.frameCount;
  const src = []; let t = 0;
  for (let i = 0; i < count && t < maxDur * sp; i++) {
    const { image } = await dec.decode({ frameIndex: i });
    const d = (image.duration > 10000 ? image.duration : 100000) / 1e6; // like browsers: 0–10 ms delay means 100 ms
    src.push({ img: image, t0: t }); t += d;
  }
  const total = Math.min(t / sp, maxDur);
  const L = layout(src[0].img.displayWidth, src[0].img.displayHeight, size, edit);
  const n = Math.max(1, Math.round(total * fps));
  let lastK = -1;
  for (let i = 0; i < n; i++) {
    const tt = i / fps * sp;
    let k = 0; while (k + 1 < src.length && src[k + 1].t0 <= tt) k++;
    if (k === lastK) { out[out.length - 1].n++; continue; } // same GIF frame -> just hold it longer
    lastK = k;
    out.push({ c: mk(L, src[k].img), n: 1 });
  }
  src.forEach(s => s.img.close());
  return { frames: out, w: L.w, h: L.h, dur: n / fps };
}

// ---------- vectorize a canvas -> lottie shape groups ----------
const r1 = x => Math.round(x * 10) / 10;
function pathToShape(p) {
  const segs = p.segments, v = [], i = [], o = [];
  const n = segs.length;
  for (let k = 0; k < n; k++) { v.push([r1(segs[k].x1), r1(segs[k].y1)]); i.push([0,0]); o.push([0,0]); }
  for (let k = 0; k < n; k++) {
    const s = segs[k];
    if (s.type === 'Q') {
      const nx = (k + 1) % n;
      o[k] = [r1((s.x2 - s.x1) * 2/3), r1((s.y2 - s.y1) * 2/3)];
      i[nx] = [r1((s.x2 - s.x3) * 2/3), r1((s.y2 - s.y3) * 2/3)];
    }
  }
  return { ty: 'sh', ks: { a: 0, k: { c: true, v, i, o } } };
}

// Shared palette for all frames (k-means over opaque pixels): stable colours, no flicker,
// and transparent pixels don't eat palette slots.
function buildPalette(frames, k, bg) {
  const px = [];
  const per = Math.ceil(30000 / frames.length);
  for (const { c } of frames) {
    const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
    const total = d.length / 4, step = Math.max(1, Math.floor(total / per));
    for (let i = 0; i < total; i += step) {
      const j = i * 4;
      if (d[j+3] < 128) continue;
      if (bg && Math.abs(d[j]-bg[0]) + Math.abs(d[j+1]-bg[1]) + Math.abs(d[j+2]-bg[2]) < 40) continue;
      px.push([d[j], d[j+1], d[j+2]]);
    }
  }
  if (!px.length) return [];
  // k-means++ init (deterministic: pick farthest point)
  const cen = [px[0].slice()];
  const dist = (a, b) => (a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2;
  const dmin = px.map(p => dist(p, cen[0]));
  while (cen.length < k) {
    let bi = 0; for (let i = 1; i < px.length; i++) if (dmin[i] > dmin[bi]) bi = i;
    if (dmin[bi] === 0) break;
    cen.push(px[bi].slice());
    for (let i = 0; i < px.length; i++) dmin[i] = Math.min(dmin[i], dist(px[i], px[bi]));
  }
  for (let it = 0; it < 10; it++) {
    const sum = cen.map(() => [0, 0, 0, 0]);
    for (const p of px) {
      let bi = 0, bd = Infinity;
      for (let c = 0; c < cen.length; c++) { const dd = dist(p, cen[c]); if (dd < bd) { bd = dd; bi = c; } }
      const s = sum[bi]; s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; s[3]++;
    }
    sum.forEach((s, c) => { if (s[3]) cen[c] = [s[0]/s[3], s[1]/s[3], s[2]/s[3]]; });
  }
  return cen.map(c => ({ r: Math.round(c[0]), g: Math.round(c[1]), b: Math.round(c[2]), a: 255 }));
}

function traceFrame(canvas, o, bgColor, pal) {
  const ctx = canvas.getContext('2d');
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  // hard alpha: semi-transparent edges -> opaque or fully transparent
  const d = img.data;
  for (let j = 0; j < d.length; j += 4) { if (d[j+3] < 128) d[j] = d[j+1] = d[j+2] = d[j+3] = 0; else d[j+3] = 255; }
  const td = ImageTracer.imagedataToTracedata(img, {
    pal: [...pal, { r: 0, g: 0, b: 0, a: 0 }],
    pathomit: o.omit, blurradius: o.blur, blurdelta: 20,
    ltres: 1, qtres: 1, rightangleenhance: false, colorquantcycles: 1, mincolorratio: 0,
  });
  // "Stacked" mode: draw every outer contour filled (ignoring holes), biggest first,
  // smaller ones on top. Shapes overlap instead of touching, so there are no seams/gaps.
  const items = [];
  td.layers.forEach((layer, ci) => {
    const c = td.palette[ci];
    if (c.a < 128) return;
    if (bgColor && Math.abs(c.r-bgColor[0]) + Math.abs(c.g-bgColor[1]) + Math.abs(c.b-bgColor[2]) < 40) return;
    layer.forEach(p => {
      if (p.isholepath || p.segments.length < 3) return;
      const b = p.boundingbox;
      items.push({ ci, area: (b[2]-b[0]) * (b[3]-b[1]), p });
    });
  });
  items.sort((a, b) => b.area - a.area);
  // merge consecutive runs of the same colour into one group to save bytes
  const groups = [];
  let cur = null;
  for (const it of items) {
    if (!cur || cur.ci !== it.ci) { cur = { ci: it.ci, shapes: [] }; groups.push(cur); }
    cur.shapes.push(pathToShape(it.p));
  }
  return groups.map(g => {
    const c = td.palette[g.ci];
    return { ty: 'gr', it: [
      ...g.shapes,
      { ty: 'fl', c: { a: 0, k: [+(c.r/255).toFixed(3), +(c.g/255).toFixed(3), +(c.b/255).toFixed(3), 1] }, o: { a: 0, k: 100 }, r: 1 },
      { ty: 'tr', p: {a:0,k:[0,0]}, a: {a:0,k:[0,0]}, s: {a:0,k:[100,100]}, r: {a:0,k:0}, o: {a:0,k:100} },
    ] };
  }).reverse(); // lottie: first item in the list is drawn on top
}

// ---------- build lottie ----------
async function build(o) {
  status(T('extract'));
  const { frames, w, h } = await extractFrames(file, o.fps, o.dur, o.res);
  let bg = null;
  if (o.transp) { const d = frames[0].c.getContext('2d').getImageData(0, 0, 1, 1).data; bg = [d[0], d[1], d[2]]; }
  const FR = 60, step = FR / o.fps;
  const scale = 512 / Math.max(w, h) * 100;
  const off = [(512 - w * scale / 100) / 2, (512 - h * scale / 100) / 2];
  const pal = buildPalette(frames, o.colors, bg);
  const layers = [];
  let slot = 0;
  for (let k = 0; k < frames.length; k++) {
    status(T('trace', k+1, frames.length)); subProg((k + 1) / frames.length);
    await new Promise(r => setTimeout(r));
    const ip = Math.round(slot * step), op = Math.round((slot + frames[k].n) * step);
    slot += frames[k].n;
    layers.push({
      ddd: 0, ind: k + 1, ty: 4, nm: 'f' + k, sr: 1, ip, op, st: 0, bm: 0,
      ks: { o:{a:0,k:100}, r:{a:0,k:0}, p:{a:0,k:[r1(off[0]), r1(off[1]), 0]}, a:{a:0,k:[0,0,0]}, s:{a:0,k:[r1(scale), r1(scale), 100]} },
      shapes: traceFrame(frames[k].c, o, bg, pal),
    });
  }
  const opEnd = Math.round(slot * step);
  return { tgs: 1, v: '5.5.2', fr: FR, ip: 0, op: opEnd, w: 512, h: 512, nm: 'sticker', ddd: 0, assets: [], layers };
}

async function gzip(str) {
  const s = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
  return await new Response(s).blob();
}

const read = () => ({ res:+$('res').value, colors:+$('colors').value, fps:+$('fps').value, dur:+$('dur').value,
  omit:+$('omit').value, blur:+$('blur').value, transp:$('transp').checked });

async function convertOne() {
  if (fmt() === 'webm') {
    const blob = await toWebm(read());
    return { blob, ext: 'webm', ok: blob.size <= 256 * 1024 };
  }
  let o = read(), json, blob;
  for (let attempt = 0; ; attempt++) {
    json = await build(o);
    blob = await gzip(JSON.stringify(json));
    const kb = blob.size / 1024;
    if (!$('auto').checked || kb <= 64 || attempt >= 16) break;
    // shrink gently, least visible losses first
    const big = kb > 100;
    if (o.omit < 16) o.omit += big ? 8 : 4;
    else if (o.res > 112) o.res -= big ? 32 : 16;
    else if (o.fps > 12) o.fps -= 3;
    else if (o.colors > 8) o.colors -= 2;
    else if (o.res > 72) o.res -= 16;
    else if (o.omit < 32) o.omit += 8;
    else if (o.colors > 4) o.colors -= 1;
    else if (o.fps > 6) o.fps -= 2;
    else break;
    status(T('shrink', kb.toFixed(1), o));
    await new Promise(r => setTimeout(r));
  }
  return { blob, ext: 'tgs', json, ok: blob.size <= 64 * 1024 };
}

// re-convert everything with the current settings
$('go').onclick = () => { if (busy) return; queue.forEach(q => { q.state = 'wait'; }); renderQueue(); runQueue(); };

function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
function uniqueNames(items) {
  const used = {};
  return items.map(q => {
    let n = baseName(q.file) + '.' + q.ext, k = 1;
    while (used[n]) n = `${baseName(q.file)} (${k++}).${q.ext}`;
    used[n] = 1; return n;
  });
}
const download = q => saveBlob(q.blob, baseName(q.file) + '.' + q.ext);
$('dl').onclick = () => { const q = queue[sel]; if (q?.state === 'done') download(q); };

// ---------- minimal ZIP (store, no compression: tgs/webm are already compressed) ----------
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = d => { let c = 0xFFFFFFFF; for (let i = 0; i < d.length; i++) c = CRC[(c ^ d[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
async function makeZip(entries) { // [{name, blob}]
  const enc = new TextEncoder(), parts = [], central = [];
  let off = 0;
  for (const e of entries) {
    const data = new Uint8Array(await e.blob.arrayBuffer()), name = enc.encode(e.name), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(12, 33, true); // UTF-8 names, date 1980-01-01
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(14, 33, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true);
    c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + data.length;
  }
  const csize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, csize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}
$('zip').onclick = async () => {
  const done = queue.filter(q => q.state === 'done');
  const names = uniqueNames(done);
  saveBlob(await makeZip(done.map((q, i) => ({ name: names[i], blob: q.blob }))), 'stickers.zip'); toast(T('zipped'));
};

applyLang(LANG);
select(-1);
</script>
